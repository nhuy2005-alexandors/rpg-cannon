name: GM Hybrid Lean Verification (isolated)
on:
  push:
    branches: ["verify/gm-hybrid-lean-final"]
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python version and full regression
        run: |
          python --version
          python -m unittest discover -s verification -p 'test_*.py' -v
      - name: Pack checked-out source for isolated diagnostics
        if: always()
        run: |
          tar --exclude='.git' -czf /tmp/rpg-cannon-source.tgz .
          cp /tmp/rpg-cannon-source.tgz checkout-source.tgz
      - name: Upload source for verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpg-cannon-source
          path: checkout-source.tgz
          if-no-files-found: error
          retention-days: 1
